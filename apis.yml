aid: black-unicorn-factory
name: Black Unicorn Factory
description: 'Black Unicorn Factory (BUF) is a Los Angeles based pre-IPO business accelerator
  that prepares companies led by founders from underrepresented communities for direct
  listings on national stock exchanges, positioning equity rather than debt as the
  route to capital. Its programs run a four-step readiness pathway — foundation and
  readiness assessment, compliance and corporate structure, SEC filing and disclosure,
  and market readiness — alongside the New Black Wall Street pre-IPO program and the
  Follow Me For Equity (FMFE) platform, an iOS and Android application through which
  individuals earn stock in participating pre-IPO companies by completing verified
  social engagement tasks instead of investing cash. Black Unicorn Factory is a private
  company whose shares appear on secondary marketplaces; it publishes no public API,
  developer portal, SDKs, or machine-readable API contract.'
